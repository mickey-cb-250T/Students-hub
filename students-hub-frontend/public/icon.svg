<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1828"/>
      <stop offset="50%" stop-color="#12141a"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8cfff"/>
      <stop offset="60%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5e8ca"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(196,181,253,0.25)" stroke-width="4"/>

  <!-- Glowing Accent Aura -->
  <circle cx="256" cy="240" r="150" fill="url(#purpleGrad)" opacity="0.18" filter="url(#glow)"/>

  <!-- Central Hub Brand Logo: Open Book / Campus Shield Motif -->
  <g transform="translate(256, 252)">
    <!-- Book Left Page -->
    <path d="M-12 -28 C-50 -70 -120 -60 -150 -36 C-156 -31 -160 -24 -160 -16 L-160 84 C-160 96 -148 104 -138 100 C-110 88 -54 84 -12 110 Z"
          fill="url(#purpleGrad)"/>
    <!-- Book Right Page -->
    <path d="M12 -28 C50 -70 120 -60 150 -36 C156 -31 160 -24 160 -16 L160 84 C160 96 148 104 138 100 C110 88 54 84 12 110 Z"
          fill="url(#purpleGrad)" opacity="0.9"/>
    <!-- Center Spine Line -->
    <path d="M0 -36 L0 120" stroke="#f3f4f8" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Spark / Knowledge Star on Top -->
    <path d="M0 -105 L8 -75 L38 -67 L8 -59 L0 -29 L-8 -59 L-38 -67 L-8 -75 Z"
          fill="url(#mintGrad)"/>
    
    <!-- Page Details -->
    <path d="M-128 10 C-100 0 -60 2 -32 20" stroke="rgba(255,255,255,0.45)" stroke-width="4" stroke-linecap="round"/>
    <path d="M-128 42 C-100 32 -60 34 -32 52" stroke="rgba(255,255,255,0.45)" stroke-width="4" stroke-linecap="round"/>
    <path d="M128 10 C100 0 60 2 32 20" stroke="rgba(255,255,255,0.45)" stroke-width="4" stroke-linecap="round"/>
    <path d="M128 42 C100 32 60 34 32 52" stroke="rgba(255,255,255,0.45)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Campus Subtext Pill -->
  <rect x="176" y="400" width="160" height="34" rx="17" fill="rgba(196,181,253,0.18)" stroke="rgba(196,181,253,0.4)" stroke-width="2"/>
  <text x="256" y="422" fill="#d8cfff" font-family="'DM Sans', -apple-system, sans-serif" font-size="15" font-weight="700" letter-spacing="3" text-anchor="middle">CAMPUS</text>
</svg>
